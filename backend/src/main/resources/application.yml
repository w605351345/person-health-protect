spring:
  application:
    name: person-health-protect

  # 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/person_health?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: your_password
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # Redis 配置
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 5000
      lettuce:
        pool:
          max-active: 8
          max-wait: -1
          max-idle: 8
          min-idle: 0

  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

  # Jackson 配置
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
    default-property-inclusion: non_null

# MyBatis 配置
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.personhealth.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    cache-enabled: true

# 应用配置
server:
  port: 8080
  servlet:
    context-path: /api

# JWT 配置
jwt:
  secret: PersonHealthProtectSecretKey2024MustBeLongEnoughForHS256Algorithm
  expiration: 86400000  # 24小时（毫秒）
  refresh-expiration: 604800000  # 7天（毫秒）

# 文件存储配置
file:
  upload-path: /data/uploads
  max-size: 10485760  # 10MB
  allowed-types: image/jpeg,image/png,image/jpg

# 身份证识别配置
idcard:
  enable-ocr: true
  ocr-api: https://api.example.com/ocr

# 第三方服务配置
external:
  # 摩熵医药API
  moneng:
    enabled: false
    base-url: https://api.moneng.com
    api-key: your_moneng_api_key
    api-secret: your_moneng_api_secret
    timeout: 30000

  # 腾讯医疗健康API
  tencent-health:
    enabled: false
    base-url: https://api.tencent.com/medical
    app-key: your_tencent_app_key
    app-secret: your_tencent_app_secret
    timeout: 30000

  # 医院CRM系统API
  hospital-crm:
    enabled: false
    base-url: https://api.hospital-crm.com
    api-key: your_hospital_crm_api_key
    timeout: 30000

  # 国家医保平台API
  national-insurance:
    enabled: false
    base-url: https://api.national-medical-insurance.gov.cn
    app-id: your_national_insurance_app_id
    app-secret: your_national_insurance_app_secret
    timeout: 30000

  # 地方医保API
  local-insurance:
    enabled: false
    base-url: https://api.local-medical-insurance.gov.cn
    api-key: your_local_insurance_api_key
    region-code: 110000  # 地区代码，如：110000-北京
    timeout: 30000

# 日志配置
logging:
  level:
    root: INFO
    com.personhealth: DEBUG
    org.springframework.web: INFO
    org.springframework.security: INFO
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n'

# SpringDoc 配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  packages-to-scan: com.personhealth.controller

# 缓存配置
cache:
  user-info: 3600      # 用户信息缓存1小时
  health-data: 1800    # 健康数据缓存30分钟
  insurance-products: 7200  # 保险产品缓存2小时

# 短信配置（用于登录验证）
sms:
  enabled: true
  provider: aliyun
  access-key-id: your_access_key
  access-key-secret: your_access_secret
  sign-name: 您的签名
  template-code: your_template_code
